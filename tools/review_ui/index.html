<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Float ETA · Private review</title><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/middle.css"><style>body{padding:2rem;max-width:1200px;margin:auto}header{margin-bottom:2rem}.filters{display:flex;gap:1rem;flex-wrap:wrap}input,select,textarea{padding:.7rem;border:1px solid #9ca59b;border-radius:6px}#list{display:grid;grid-template-columns:minmax(220px,1fr) minmax(0,2fr);gap:1.5rem;margin-top:2rem}#items{max-height:75vh;overflow:auto}#items button{display:block;width:100%;text-align:left;padding:1rem;margin-bottom:.5rem;background:#fff;border:1px solid #ccd3c9;border-radius:8px;color:#22382b}#detail{padding:1.5rem;background:#fff;border-radius:12px;min-width:0}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:.85rem;max-height:460px;overflow:auto}.columns{display:grid;grid-template-columns:1fr 1fr;gap:1rem}.columns div{overflow-wrap:anywhere}textarea{width:100%;box-sizing:border-box}#pinMap{height:340px;margin:1rem 0}button,a{cursor:pointer}#summary{line-height:1.7}@media(max-width:700px){body{padding:1rem}#list{grid-template-columns:1fr}#items{max-height:280px}.columns{grid-template-columns:1fr}}</style></head><body><header><p>FLOAT ETA · LOCAL WORKSPACE</p><h1>Access and section review</h1><p>Research, community evidence, and section readiness in one place. Review decisions are private and do not publish catalog changes.</p><a href="/">Open local planner</a></header><p id="summary" role="status">Loading review inventory…</p><div class="filters"><label>Queue <select id="queue"><option value="sections">Section readiness</option><option value="research">Research evidence</option><option value="submissions">Community submissions</option></select></label><label>State <select id="state"><option value="">All states</option></select></label><label>Find <input id="search" placeholder="Access, river, blocker…"></label><label><input id="blocked" type="checkbox"> Unresolved only</label></div><main id="list"><nav id="items" aria-label="Review items"></nav><section id="detail"><p>Choose an item to inspect its evidence.</p></section></main><script src="/map-base.js"></script><script src="/review.js"></script></body></html>
