# Float ETA — preserves the existing paid compute plan.
services:
  - type: web
    name: floattime-mt
    runtime: python
    plan: 0.5c-512mb
    buildCommand: "pip install -r requirements.txt && python3 tools/build_catalog.py --check && python3 -m unittest discover -s tests"
    startCommand: "python3 server.py"
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    disk:
      name: floattime-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
